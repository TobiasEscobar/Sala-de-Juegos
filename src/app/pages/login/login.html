<div class="container-fluid d-flex justify-content-center align-items-center min-vh-100 font-inter">
    <div class="bg-xbox-section text-xbox-white p-4 py-lg-5 px-lg-5 container-login">
        <h2 class="display-4 text-center text-xbox-white">Iniciar Sesión</h2>
        <p class="text-center text-xbox-green">Ingresa tus datos para continuar</p>
        <!-- Formulario de login -->
        <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
            <div class="row pt-4">
                <!-- Email -->
                <div class="col-12 mb-4">
                    <label for="email" class="form-label fw-bold text-xbox-gray">Correo electrónico</label>
                    <input id="email" type="email" class="form-control bg-dark text-xbox-white border-0" placeholder="Ingrese su email" formControlName="email">
                    @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
                        <small class="text-danger">Ingrese un email válido</small>
                    }
                </div>

                <!-- Password -->
                <div class="col-12 mb-4">
                    <label for="password" class="form-label fw-bold text-xbox-gray">Contraseña</label>
                    <div class="input-group">
                        <input id="password" [type]="passwordVisible ? 'text' : 'password'" class="form-control bg-dark text-xbox-white border-0" placeholder="Ingrese su contraseña" formControlName="password">
                        <button class="btn btn-outline-secondary" type="button" (click)="togglePasswordVisibility()">
                        {{ passwordVisible ? 'Ocultar' : 'Ver' }}
                        </button>
                    </div>
                    @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
                        <small class="text-danger">La contraseña es obligatoria</small>
                    }
                </div>

                <!-- Botón login -->
                <div class="col-12 d-flex justify-content-center mt-3">
                    <button type="submit" class="btn bg-xbox-green text-xbox-white px-5 py-2 w-50" style="border-radius: 50px;">Ingresar</button>
                </div>
            </div>
        </form>

        <!-- Acceso rápido fuera del form pero dentro de la tarjeta -->
        <div class="mt-4 text-center">
            <p class="text-muted text-xbox-white" >Acceso rápido</p>
            <div class="d-flex justify-content-around">
                <button class="btn bg-xbox-green text-xbox-white px-4 py-2" style="border-radius: 50px;" (click)="quickAccess('emailYo')">Usuario 1</button>
                <button class="btn bg-xbox-green text-xbox-white px-4 py-2" style="border-radius: 50px;" (click)="quickAccess('emailSofi')">Usuario 2</button>
                <button class="btn bg-xbox-green text-xbox-white px-4 py-2" style="border-radius: 50px;" (click)="quickAccess('emailSimba')">Usuario 3</button>
            </div>
        </div>

    </div>
</div>
