<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" routerLink="/home">Sala de Juegos</a>

        <!-- Boton desplegable -->
        <button
            class="navbar-toggler"
            type="button"
            (click)="menuAbierto = !menuAbierto"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Contenedor del menú -->
        <div class="collapse navbar-collapse" [class.show]="menuAbierto" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" routerLink="/home">Home</a>
                </li>
                <li>
                    <a class="nav-link" routerLink="/rankings">Rankings</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/quien-soy">Sobre mi</a>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                @if (!isLogged) {
                <li class="nav-item">
                    <a class="nav-link" routerLink="/login">Iniciar sesión</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/registro">Registrarse</a>
                </li>
                } @else {
                <li class="nav-item">
                    <span class="nav-link">Ingreso con: {{ currentUser?.nombre }}</span>
                </li>
                <li class="nav-item">
                    <a class="nav-link" (click)="logout()">Cerrar sesión</a>
                </li>
                }
